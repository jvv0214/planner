<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spaced Repetition Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s ease; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-slate-800 mb-2">🧠 에빙하우스 극복 플래너</h1>
            <p class="text-slate-600">간격 반복 학습과 AI 연상 암기 도우미</p>
        </header>

        <!-- Input Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-slate-200">
            <h2 class="text-xl font-semibold mb-4 text-slate-700">새로운 학습 내용 추가</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-1">학습 주제</label>
                    <input id="topicInput" type="text" placeholder="예: 광합성 작용, 영단어 'Ephemeral'" class="w-full p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-1">핵심 요약</label>
                    <textarea id="contentInput" rows="3" placeholder="기억하고 싶은 핵심 내용을 적어주세요." class="w-full p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"></textarea>
                </div>
                <div class="flex gap-2">
                    <button onclick="addStudyItem()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                        플랜에 추가하기
                    </button>
                    <button onclick="generateMnemonics()" id="aiBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
                        <span>✨ AI 연상 도우미</span>
                    </button>
                </div>
            </div>
            <!-- AI Output Area -->
            <div id="aiOutput" class="hidden mt-4 p-4 bg-purple-50 rounded-lg border border-purple-100 text-purple-900 text-sm leading-relaxed">
                <!-- AI content will be injected here -->
            </div>
        </section>

        <!-- Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <span class="block text-2xl font-bold text-blue-600" id="statTotal">0</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">전체 학습</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <span class="block text-2xl font-bold text-orange-600" id="statToday">0</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">오늘 복습 필요</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <span class="block text-2xl font-bold text-green-600" id="statMastered">0</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">완료된 학습</span>
            </div>
        </div>

        <!-- Study List -->
        <section>
            <h2 class="text-xl font-semibold mb-4 text-slate-700">나의 복습 타임라인</h2>
            <div id="studyList" class="space-y-4">
                <!-- Items will be added here -->
                <div class="text-center py-10 text-slate-400 italic">
                    아직 등록된 학습 내용이 없습니다. 위에서 첫 학습을 시작해보세요!
                </div>
            </div>
        </section>
    </div>

    <script>
        const apiKey = "AIzaSyCBxNmth3HeIvPjDRTDBhGkZAPPhMJEMac"; // API key is handled by the environment
        let studyItems = JSON.parse(localStorage.getItem('spaced_items') || '[]');

        function saveItems() {
            localStorage.setItem('spaced_items', JSON.stringify(studyItems));
            renderItems();
            updateStats();
        }

        function addStudyItem() {
            const topic = document.getElementById('topicInput').value;
            const content = document.getElementById('contentInput').value;
            if (!topic) return;

            const newItem = {
                id: Date.now(),
                topic,
                content,
                createdAt: new Date().toISOString(),
                nextReview: new Date().toISOString(),
                level: 0, // 0: Today, 1: 1d, 2: 3d, 3: 7d, 4: 14d, 5: 30d
                history: []
            };

            studyItems.unshift(newItem);
            saveItems();
            
            document.getElementById('topicInput').value = '';
            document.getElementById('contentInput').value = '';
            document.getElementById('aiOutput').classList.add('hidden');
        }

        function getIntervalDays(level) {
            const intervals = [1, 3, 7, 14, 30, 60];
            return intervals[level] || 90;
        }

        function markReview(id, success) {
            const item = studyItems.find(i => i.id === id);
            if (!item) return;

            if (success) {
                const days = getIntervalDays(item.level);
                const nextDate = new Date();
                nextDate.setDate(nextDate.getDate() + days);
                item.nextReview = nextDate.toISOString();
                item.level++;
            } else {
                item.level = 0;
                item.nextReview = new Date().toISOString();
            }
            
            saveItems();
        }

        function deleteItem(id) {
            studyItems = studyItems.filter(i => i.id !== id);
            saveItems();
        }

        async function generateMnemonics() {
            const topic = document.getElementById('topicInput').value;
            const content = document.getElementById('contentInput').value;
            const aiBtn = document.getElementById('aiBtn');
            const aiOutput = document.getElementById('aiOutput');

            if (!topic) {
                showSimpleMessage("주제를 먼저 입력해주세요.");
                return;
            }

            aiBtn.disabled = true;
            aiBtn.innerHTML = '<div class="spinner"></div> 생성 중...';
            aiOutput.classList.remove('hidden');
            aiOutput.innerHTML = "✨ AI가 연상 기법과 배경지식을 찾는 중입니다...";

            const prompt = `주제: ${topic}\n내용: ${content}\n\n위 내용을 에빙하우스 망각곡선을 극복할 수 있도록 장기 기억으로 전환하기 위한 '연상 암기법(Mnemonic)'과 이와 관련된 '흥미로운 배경지식'을 한국어로 작성해줘. 기억하기 쉬운 비유나 역사적 사실, 유머를 섞어서 짧고 강렬하게 써줘.`;

            try {
                let success = false;
                let retries = 0;
                let resultText = "";

                while (!success && retries < 5) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }]
                            })
                        });
                        const data = await response.json();
                        resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (resultText) success = true;
                    } catch (e) {
                        retries++;
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                    }
                }

                if (success) {
                    aiOutput.innerHTML = `<strong>💡 AI 암기 팁:</strong><br>${resultText.replace(/\n/g, '<br>')}`;
                } else {
                    aiOutput.innerHTML = "❌ AI 요청에 실패했습니다. 다시 시도해주세요.";
                }
            } catch (err) {
                aiOutput.innerHTML = "❌ 오류가 발생했습니다.";
            } finally {
                aiBtn.disabled = false;
                aiBtn.innerHTML = '✨ AI 연상 도우미';
            }
        }

        function showSimpleMessage(msg) {
            const div = document.createElement('div');
            div.className = "fixed top-4 right-4 bg-slate-800 text-white p-3 rounded shadow-lg z-50 transition-opacity duration-500";
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 500);
            }, 2000);
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('statTotal').innerText = studyItems.length;
            document.getElementById('statToday').innerText = studyItems.filter(i => i.nextReview.split('T')[0] <= today).length;
            document.getElementById('statMastered').innerText = studyItems.filter(i => i.level > 4).length;
        }

        function renderItems() {
            const list = document.getElementById('studyList');
            if (studyItems.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-slate-400 italic">아직 등록된 학습 내용이 없습니다.</div>';
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];

            list.innerHTML = studyItems.map(item => {
                const isDue = item.nextReview.split('T')[0] <= todayStr;
                const nextDate = new Date(item.nextReview).toLocaleDateString();
                
                return `
                    <div class="card bg-white p-5 rounded-xl shadow-sm border ${isDue ? 'border-orange-300 bg-orange-50' : 'border-slate-200'}">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold px-2 py-1 rounded bg-slate-100 text-slate-500 uppercase">Level ${item.level}</span>
                                ${isDue ? '<span class="text-xs font-bold px-2 py-1 rounded bg-orange-500 text-white ml-2">복습 필요</span>' : ''}
                            </div>
                            <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-red-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">${item.topic}</h3>
                        <p class="text-sm text-slate-600 mt-1 mb-4">${item.content || '내용 없음'}</p>
                        
                        <div class="flex items-center justify-between mt-4 pt-4 border-t border-slate-100">
                            <span class="text-xs text-slate-400">다음 복습: ${nextDate}</span>
                            <div class="flex gap-2">
                                <button onclick="markReview(${item.id}, false)" class="text-xs font-semibold px-3 py-1.5 rounded border border-slate-300 text-slate-600 hover:bg-slate-50 transition">까먹음</button>
                                <button onclick="markReview(${item.id}, true)" class="text-xs font-semibold px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700 transition">기억함!</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Init
        renderItems();
        updateStats();
    </script>
</body>
</html>
